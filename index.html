<script>
    // Variáveis globais para armazenar os dados vindos do Neon
    let clientesData = [];
    let mensalidadesData = [];

    // Função que busca os dados reais da API (Neon) quando a página abre
    async function carregarDadosDoBanco() {
        try {
            const resClientes = await fetch('/api/clientes');
            clientesData = await resClientes.json();

            const resMensalidades = await fetch('/api/mensalidades');
            mensalidadesData = await resMensalidades.json();

            // Renderiza a interface com os dados reais do banco
            if (typeof renderDashboard === 'function') renderDashboard();
            if (typeof renderClientesTable === 'function') renderClientesTable();
            if (typeof renderMensalidadesTable === 'function') renderMensalidadesTable();
            if (typeof populateFichaSelect === 'function') populateFichaSelect();
        } catch (error) {
            console.error("Erro ao carregar dados do banco:", error);
        }
    }

    // Executa a carga dos dados assim que a página é carregada
    window.onload = carregarDadosDoBanco;
</script>
